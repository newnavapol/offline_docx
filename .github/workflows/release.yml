name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*' # Trigger only when a version tag (like v1.0.0) is pushed
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' 

      - name: Install PyInstaller and Requirements
        run: pip install pyinstaller

      - name: Build Windows EXE
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --add-data "templates;templates" --name "IPD_Document_Generator" main.py

      - name: Build Mac APP
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --windowed --add-data "templates:templates" --name "IPD_Document_Generator" main.py
          cd dist
          zip -r IPD_Document_Generator_Mac.zip IPD_Document_Generator.app

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/IPD_Document_Generator.exe
            dist/IPD_Document_Generator_Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
